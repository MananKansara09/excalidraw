# Production deployment: Excalidraw + Plus server, behind the Caddy already
# running on the host (see Caddyfile.plus). Set DOMAIN and PLUS_SECRET in
# .env.plus first. See DEPLOY.md.

services:
  plus:
    build:
      context: .
      dockerfile: Dockerfile.plus
      args:
        # baked into the web app at build time: rebuild after changing DOMAIN
        VITE_APP_WS_SERVER_URL: https://${DOMAIN}
    restart: unless-stopped
    env_file: .env.plus
    environment:
      PLUS_PUBLIC_URL: https://${DOMAIN}
      PLUS_SECURE_COOKIES: "true"
    # localhost only: the host's Caddy is the public entry point
    ports:
      - "127.0.0.1:${PLUS_PORT:-3015}:3015"
    volumes:
      - plus-data:/data

  # live collaboration (Socket.IO); the host's Caddy sends /socket.io/ here
  room:
    build:
      context: https://github.com/excalidraw/excalidraw-room.git#03ff435860b508d7cd9e005cfc90f7977ae2a593
      dockerfile_inline: |
        # Live collaboration relay (https://github.com/excalidraw/excalidraw-room).
        # Built from source because the published image is old and amd64 only.

        FROM node:22-alpine AS build

        WORKDIR /excalidraw-room

        COPY package.json yarn.lock ./
        RUN yarn --frozen-lockfile --ignore-engines --network-timeout 600000

        COPY tsconfig.json ./
        COPY src ./src
        RUN yarn build \
          && yarn --frozen-lockfile --ignore-engines --production


        FROM node:22-alpine

        ENV NODE_ENV=production \
            PORT=3002

        WORKDIR /excalidraw-room

        COPY --from=build /excalidraw-room/package.json ./
        COPY --from=build /excalidraw-room/node_modules node_modules
        COPY --from=build /excalidraw-room/dist dist

        USER node
        EXPOSE 3002

        HEALTHCHECK --interval=30s --timeout=5s \
          CMD node -e "fetch('http://localhost:'+process.env.PORT).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"

        CMD ["node", "dist/index.js"]
    restart: unless-stopped
    environment:
      CORS_ORIGIN: https://${DOMAIN}
    ports:
      - "127.0.0.1:${ROOM_PORT:-3002}:3002"

volumes:
  plus-data:
